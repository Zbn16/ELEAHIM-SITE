<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylesheets/main.css">
    <title>ELEAHIM Search</title>
</head>
<body>
    <video class="background-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
        <source src="assets/backgrounds/minecraft-nebula-night-live-wallpaper.mp4" type="video/mp4">
    </video>

    <header class="site-header">
        <h1>ELEAHIM</h1>
        <p class="tagline">FIRST DAY OF THE SITE!</p>
        <p class="tagline">IM BI AS SHIIT</p>
        
        <!-- Added Games Button Links Below -->
        <div class="navigation-actions">
            <a href="game.html" class="games-btn">Go to Games</a>
        </div>

        <form class="search-form" action="https://www.google.com/search" method="get" role="search">
            <label class="sr-only" for="site-search">Search</label>
            <input id="site-search" name="q" type="search" placeholder="Search the web" autocomplete="off" />
            <button type="submit" aria-label="Submit search">🔍</button>
        </form>
    </header>
</body>
</html>
